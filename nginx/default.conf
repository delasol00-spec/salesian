server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # アップロードサイズ上限: 1000MB
    client_max_body_size 1000M;

    # ルートへのアクセスは /seibi/ へリダイレクト
    location = / {
        return 301 /seibi/;
    }

    # /seibi/cms/ 配下の PHP → WordPressコア（/var/www/html/）へ rewrite
    # 例: /seibi/cms/wp-admin/index.php → /wp-admin/index.php
    location ~ ^/seibi/cms/(.+\.php)$ {
        rewrite ^/seibi/cms/(.+\.php)$ /$1 last;
    }

    # /seibi/cms/ 配下の静的ファイル → /var/www/html/cms/ から配信
    # 例: /seibi/cms/wp-content/themes/salesian/assets/css/style.css
    location /seibi/cms/ {
        alias /var/www/html/cms/;
    }

    # /seibi/ → WordPress フロントエンド
    location /seibi/ {
        try_files $uri $uri/ /seibi/index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=1000M \n post_max_size=1000M \n memory_limit=512M \n max_execution_time=300";
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
