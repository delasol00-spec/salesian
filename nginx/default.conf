server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # アップロードサイズ上限: 1000MB
    client_max_body_size 1000M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # /cms/ 配下の静的ファイルはそのまま /var/www/html/cms/ からサーブ
    # /cms/ 配下のPHPはWordPressコア（/var/www/html/）にrewriteして処理
    location ~ ^/cms/(.+\.php)$ {
        rewrite ^/cms/(.+\.php)$ /$1 last;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=1000M \n post_max_size=1000M \n memory_limit=512M \n max_execution_time=300";
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
