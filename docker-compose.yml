services:
  nginx:
    image: nginx:alpine
    ports:
      - "8110:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./index.php:/var/www/html/index.php
      - ./.htaccess:/var/www/html/.htaccess
      - ./seibi/:/var/www/html/seibi/           # /seibi/ サブディレクトリエントリポイント
      - wordpress_data:/var/www/html/cms        # WordPressコア（volume）
      - ./cms/wp-content:/var/www/html/cms/wp-content  # ローカル管理
      - ./cms/wp-config.php:/var/www/html/cms/wp-config.php  # ローカル管理
      - ./cms/.htaccess:/var/www/html/cms/.htaccess  # ローカル管理
    depends_on:
      - wordpress
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.3-fpm
    volumes:
      - wordpress_data:/var/www/html            # WordPressコアをここに展開
      - ./seibi/:/var/www/html/seibi/           # /seibi/ サブディレクトリエントリポイント
      - ./cms/wp-content:/var/www/html/wp-content  # ローカル管理
      - ./cms/wp-config.php:/var/www/html/wp-config.php  # ローカル管理
      - ./cms/.htaccess:/var/www/html/.htaccess  # ローカル管理
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    depends_on:
      - mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8111:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped

volumes:
  wordpress_data:   # WordPressコアファイル（wp-admin, wp-includes等）
  mysql_data:       # MySQLデータ
