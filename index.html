<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サレジアン国際学園小学校</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..25" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="entrance.css" />
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo"><img src="img/splash.png" /></div>
    </div>

    <nav class="navbar">
      <div class="logo"><img src="img/top-logo.png" alt="サレジアン国際学園小学校" /></div>
      <div class="menu-btn" id="menu-btn">
        <span class="menu-label">MENU</span>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
      <ul class="nav-links" id="nav-links">
        <li class="nav-menu-logo">
          <img src="img/menu-logo.svg" alt="サレジアン国際学園小学校" />
        </li>
        <li><a href="seibi/">星美クラス</a></li>
        <li><a href="#">インターナショナルクラス</a></li>
        <li><a href="#">学校長挨拶</a></li>
        <li><a href="#">沿革</a></li>
        <li><a href="#">アクセス</a></li>
      </ul>
    </nav>

    <div class="split-container">
      <a href="seibi/" class="split-item right">
        <div class="bg-img"></div>
        <div class="content">
          <h1 class="seibi">星美クラス</h1>
          <p>Traditional Seibi Class</p>
        </div>
      </a>
      <a href="#left" class="split-item left">
        <div class="bg-img"></div>
        <div class="content">
          <h1>インターナショナルクラス</h1>
          <p>Innovative International Class</p>
        </div>
      </a>
    </div>

    <footer class="footer">
      <p>&copy; SALESIAN INTERNATIONAL SCHOOL All Rights Reserved.</p>
      <p>〒115-8524 東京都北区赤羽台4-2-14</p>
      <!--<div class="footer-sns">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
      </div> -->
    </footer>

    <script>
      window.addEventListener("load", () => {
        const splash = document.getElementById("splash");

        // 1500ミリ秒（1.5秒）後にスプラッシュを終了させる
        setTimeout(() => {
          splash.classList.add("done");
        }, 1500);
      });

      const menuBtn = document.getElementById("menu-btn");
      const navLinks = document.getElementById("nav-links");
      menuBtn.addEventListener("click", () => {
        navLinks.classList.toggle("active");
        menuBtn.classList.toggle("active");
      });
      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          navLinks.classList.remove("active");
          menuBtn.classList.remove("active");
        });
      });
    </script>
  </body>
</html>
