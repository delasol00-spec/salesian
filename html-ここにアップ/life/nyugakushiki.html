    <div class="modal fade" id="yearImageModal" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
        <div class="modal-content bg-transparent border-0" style="position: relative">
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="閉じる"
            style="position: absolute; top: -36px; right: 0; z-index: 3; font-size: 2rem; line-height: 1; color: #fff; opacity: 1"
          >
            <span aria-hidden="true">&times;</span>
          </button>
          <div class="modal-body text-center" style="position: relative; padding: 30px; background: #fff">
            <button
              type="button"
              id="yearImagePrev"
              aria-label="前の画像"
              style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); border: 0; background: rgba(0, 0, 0, 0.45); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; line-height: 1; z-index: 2"
            >
              ‹
            </button>
            <img id="yearImageModalImg" class="img-fluid" />
            <button
              type="button"
              id="yearImageNext"
              aria-label="次の画像"
              style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: rgba(0, 0, 0, 0.45); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; line-height: 1; z-index: 2"
            >
              ›
            </button>
          </div>
        </div>
      </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/loading.js"></script>
    <script>
      (function () {
        var images = Array.prototype.slice.call(document.querySelectorAll(".js-year-zoom"));
        var modalImg = document.getElementById("yearImageModalImg");
        var prevBtn = document.getElementById("yearImagePrev");
        var nextBtn = document.getElementById("yearImageNext");
        var currentIndex = 0;
        if (!images.length || !modalImg || !prevBtn || !nextBtn) return;

        function renderImage(index) {
          currentIndex = (index + images.length) % images.length;
          modalImg.src = images[currentIndex].src;
          modalImg.alt = images[currentIndex].alt;
        }

        function openAt(index) {
          renderImage(index);
          $("#yearImageModal").modal("show");
        }

        images.forEach(function (img, index) {
          img.addEventListener("click", function () {
            openAt(index);
          });
          img.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openAt(index);
            }
          });
        });

        prevBtn.addEventListener("click", function () {
          renderImage(currentIndex - 1);
        });

        nextBtn.addEventListener("click", function () {
          renderImage(currentIndex + 1);
        });

        document.addEventListener("keydown", function (e) {
          if (!document.body.classList.contains("modal-open")) return;
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            renderImage(currentIndex - 1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            renderImage(currentIndex + 1);
          }
        });
      })();
    </script>
