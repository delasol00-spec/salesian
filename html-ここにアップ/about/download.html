    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

    <div id="seibi-splash">
      <div class="splash-img"><img src="../img/loading.webp" alt="Loading..." /></div>
      <div class="splash-wipe"></div>

    <header class="mobile-header d-lg-none fixed-top">
      <div class="d-flex justify-content-between align-items-center px-3 h-100">
        <a href="../" class="mobile-logo">
          <img src="../img/top-logo-sm.svg" alt="Logo" class="header-logo" />

        <button class="navbar-toggler-custom" type="button" id="mobileMenuBtn"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
      </div>
    </header>

    <div class="container-fluid p-0">
      <main class="sub-page-view">
        <div class="sub-hero">
          <img src="img/about-bg.webp" alt="" class="sub-hero-img" />

        <section class="page-title">

        <div class="row justify-content-center">
          <div class="col-md-6 col-12 mb-3 text-center">

              </a><br />
            <small>リンクをクリックするとお使いのブラウザにカタログが表示されます。<br />
