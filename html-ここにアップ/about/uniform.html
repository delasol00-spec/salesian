<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星美の制服 - サレジアン国際学園小学校 - 星美クラス</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..25" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/loading.css" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="seibi-splash">
      <div class="splash-img"><img src="../img/loading.webp" alt="Loading..." /></div>
      <div class="splash-wipe"></div>
    </div>
    <header class="mobile-header d-lg-none fixed-top">
      <div class="d-flex justify-content-between align-items-center px-3 h-100">
        <a href="../" class="mobile-logo">
          <img src="../img/top-logo-sm.svg" alt="Logo" class="header-logo" />
        </a>
        <button class="navbar-toggler-custom" type="button" id="mobileMenuBtn"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
      </div>
    </header>

    <div class="container-fluid p-0">
      <main class="sub-page-view">
        <div class="sub-hero">
          <picture>
            <source media="(max-width: 991px)" srcset="img/hero-about-bg.webp" />
            <img src="img/about-bg.webp" alt="" class="sub-hero-img" />
          </picture>
        </div>

        <section class="page-title">
          <h1>星美の制服</h1>
          <div class="inner-border"></div>
        </section>
      </main>

      <div data-include="../side-menu.html"></div>
    </div>

    <div id="sidebar-overlay"></div>

    <section class="p-70-70">
      <div class="container">
        <div class="row uniform">
          <div class="col-md-6 col-12 mb-3">
            <img src="uniform-img/uni-winter.webp" class="img-fluid r-top-10" loading="lazy" alt="冬服" />
            <p class="img-title r-bottom-10 bg-pink">冬服</p>
          </div>
          <div class="col-md-6 col-12">
            <img src="uniform-img/uni-summer.webp" class="img-fluid r-top-10" loading="lazy" alt="夏服" />
            <p class="img-title r-bottom-10 bg-blue">夏服</p>
          </div>
        </div>
      </div>
    </section>

    <div id="footerContainer" data-include="../footer.html"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/loading.js"></script>
  </body>
</html>
